<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSHPark Random Board Picker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #191f2c;
            color: #d0d0d0;
            line-height: 1.6;
        }

        .container {
            max-width: 500px;
            margin: 100px auto;
            padding: 40px;
            background: #12171f;
            border: 1px solid #333;
            border-radius: 4px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #888;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
            text-align: center;
            font-size: 12px;
        }

        .footer a {
            color: #4a9eff;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer a:hover {
            color: #6bb3ff;
        }

        .github-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-of-type {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #333;
            background: #0f0f0f;
            color: #d0d0d0;
            border-radius: 3px;
            font-size: 13px;
            font-family: 'Monaco', 'Courier New', monospace;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #555;
        }

        input::placeholder {
            color: #555;
        }

        button {
            width: 100%;
            padding: 11px 0;
            background: #2a2a2a;
            color: #d0d0d0;
            border: 1px solid #444;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Monaco', 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        button:hover {
            background: #333;
            border-color: #555;
            color: #ffffff;
        }

        button:active {
            background: #2a2a2a;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            background: #0f0f0f;
            border: 1px solid #333;
            display: none;
            border-radius: 3px;
        }

        #result.show {
            display: block;
        }

        #result.error {
            border-color: #555;
            background: #0f0f0f;
        }

        .board-title {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .board-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .board-price {
            color: #4a9eff;
            font-weight: 600;
        }

        .board-layers {
            color: #888;
        }

        .board-link {
            display: inline-block;
            color: #4a9eff;
            text-decoration: none;
            font-size: 12px;
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .board-link:hover {
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .board-details {
            font-size: 12px;
            color: #888;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #333;
            line-height: 1.8;
        }

        .board-details-label {
            color: #b0b0b0;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-top: 8px;
            margin-bottom: 2px;
        }

        .board-details-label:first-child {
            margin-top: 0;
        }

        .board-dimensions {
            color: #d0d0d0;
        }

        .board-description {
            color: #999;
            font-style: italic;
            margin-top: 8px;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 13px;
        }

        .loading {
            display: none;
            color: #888;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 640px) {
            .container {
                margin: 20px auto;
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }

            .board-meta {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OSH Picker</h1>
        <div class="subtitle">Random PCB finder</div>

        <form id="boardForm">
            <div class="form-group">
                <label for="keyword">Keyword <span style="color: #666;">(optional)</span>:</label>
                <input type="text" id="keyword" name="keyword" placeholder="esp32, stm32, arduino">
            </div>

            <div class="form-group">
                <label for="maxPrice">Max Price <span style="color: #666;">(optional)</span>:</label>
                <input type="number" id="maxPrice" name="maxPrice" placeholder="15.00" step="0.01" min="0">
            </div>

            <div class="form-group">
                <label for="layers">Layer Counts:</label>
                <select id="layers" name="layers">
                    <option value="2">2-layer (default)</option>
                    <option value="4">4-layer</option>
                    <option value="6">6-layer</option>
                    <option value="2 4">2 or 4 layer</option>
                    <option value="2 4 6">2, 4, or 6 layer</option>
                </select>
            </div>

            <button type="submit">Find Board</button>
        </form>

        <div class="loading" id="loading">
            searching...
        </div>

        <div id="result">
            <div class="board-title" id="boardTitle"></div>
            <div class="board-meta">
                <span class="board-price" id="boardPrice"></span>
                <span class="board-layers" id="boardLayers"></span>
            </div>
            <div id="boardDescriptionMain" style="display: none; margin: 12px 0; padding: 12px 0; border-top: 1px solid #333; border-bottom: 1px solid #333;">
                <span id="boardDescriptionText" style="color: #999; font-size: 12px; line-height: 1.6;"></span>
            </div>
            <div class="board-details" id="boardDetails" style="display: none;">
                <div id="dimensionsSection"></div>
            </div>
            <a id="boardLink" class="board-link" target="_blank">open on osh park</a>
        </div>

        <div class="footer">
            <a href="https://github.com/unixvoid/OSH_Picker" target="_blank">
                <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.839 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.204-6.096 8.204-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                view source on github
            </a>
        </div>
    </div>

    <script>
        'use strict';

        // ---- config (mirrors random_board.py) ----
        const OSHPARK_BASE = 'https://oshpark.com/shared_projects';
        const CACHE_TTL_MS = 30 * 60 * 1000;   // 30 minutes, like CACHE_TTL
        const MAX_ATTEMPTS = 500;              // cap on the random sampling loop (server version could scan the whole pool)

        // ---- IndexedDB cache (replaces .sitemap_cache/sitemap.json) ----
        function openCacheDb() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('osh_picker_cache', 1);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains('meta')) {
                        db.createObjectStore('meta');
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function loadCachedProjects() {
            try {
                const db = await openCacheDb();
                const entry = await new Promise((resolve, reject) => {
                    const tx = db.transaction('meta', 'readonly');
                    const req = tx.objectStore('meta').get('sitemap');
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
                db.close();
                if (entry && Date.now() - entry.savedAt < CACHE_TTL_MS) {
                    console.log(`loaded sitemap from cache (${entry.projects.length} projects)`);
                    return entry.projects;
                }
                return null;
            } catch (e) {
                console.log(`error loading cache: ${e}`);
                return null;
            }
        }

        async function saveCachedProjects(projects) {
            try {
                const db = await openCacheDb();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction('meta', 'readwrite');
                    tx.objectStore('meta').put({ savedAt: Date.now(), projects }, 'sitemap');
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
                db.close();
                console.log(`saved sitemap to cache (${projects.length} projects)`);
            } catch (e) {
                console.log(`error saving cache: ${e}`);
            }
        }

        // ---- sitemap (port of OSHParkScraper._parse_sitemap / get_project_ids) ----
        function parseSitemap(xmlText) {
            const projects = [];
            const locRe = /<loc>https:\/\/oshpark\.com\/shared_projects\/([a-zA-Z0-9]+)<\/loc>/;
            const titleRe = /<Attribute name="title">([^<]+)<\/Attribute>/;
            const descRe = /<Attribute name="description">([^<]*)<\/Attribute>/;

            const blocks = xmlText.split('<url>');
            for (let i = 1; i < blocks.length; i++) {
                const block = blocks[i];
                const locMatch = block.match(locRe);
                if (!locMatch) continue;
                const titleMatch = block.match(titleRe);
                const descMatch = block.match(descRe);
                projects.push({
                    id: locMatch[1],
                    title: titleMatch ? titleMatch[1] : null,
                    description: descMatch ? descMatch[1] : null
                });
            }
            return projects;
        }

        async function fetchSitemapProjects(onProgress) {
            // OSHPark rotates its redirect target (no-cache) and the edge can serve
            // transient failures - retry a few times before giving up.
            const maxAttempts = 3;
            let lastError = null;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                if (attempt > 1) {
                    onProgress && onProgress(`retrying project list download (${attempt}/${maxAttempts})...`);
                    await new Promise(r => setTimeout(r, 1500 * attempt));
                }
                try {
                    // no-store: never reuse a stale/failed response from the browser HTTP cache
                    const response = await fetch(OSHPARK_BASE, { redirect: 'follow', cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const projects = parseSitemap(await response.text());
                    if (!projects.length) {
                        throw new Error('sitemap parsed to 0 projects');
                    }
                    console.log(`parsed ${projects.length} total projects from sitemap`);
                    await saveCachedProjects(projects);
                    return projects;
                } catch (e) {
                    lastError = e;
                    console.log(`sitemap attempt ${attempt}/${maxAttempts} failed: ${e.message}`);
                }
            }
            throw new Error(`could not load project list from OSHPark (${lastError && lastError.message}) - OSHPark regenerates its sitemap periodically, try again in a minute`);
        }

        async function getProjectPool(onProgress) {
            const cached = await loadCachedProjects();
            if (cached) {
                return cached;
            }
            onProgress && onProgress('downloading project list from OSHPark (~23 MB, first visit only - cached for 30 min)...');
            return await fetchSitemapProjects(onProgress);
        }

        function filterByKeyword(projects, keyword) {
            if (!keyword) return projects;
            const k = keyword.toLowerCase();
            const filtered = projects.filter(p =>
                (p.title || '').toLowerCase().includes(k) ||
                (p.description || '').toLowerCase().includes(k)
            );
            console.log(`found ${filtered.length} projects matching keyword '${keyword}'`);
            return filtered;
        }

        // ---- project pages (port of fetch_project_details / parse_project_page) ----
        function parseProjectPage(html, projectId, projectUrl, layers, maxPrice) {
            let title = 'Unknown Board';
            let price = null;
            let layerCount = null;
            let dimensions = null;
            let description = null;

            // Layer count: "2 layer board"
            const layerMatch = html.match(/(\d+)\s*layer\s*board/i);
            if (!layerMatch) {
                console.log(`  ${projectId}: could not determine layer count, skipping`);
                return null;
            }
            layerCount = parseInt(layerMatch[1], 10);
            if (!layers.includes(layerCount)) {
                console.log(`  ${projectId}: ${layerCount}-layer board, but only ${layers} supported, skipping`);
                return null;
            }

            // Price: "Total Price" ... $NN.NN (may span tags/newlines)
            const priceMatch = html.match(/Total Price.*?\$\s*([\d.]+)/s);
            if (priceMatch) {
                const parsed = parseFloat(priceMatch[1]);
                if (!isNaN(parsed)) {
                    price = parsed;
                }
            }

            // Title from <title> tag, then h3 override
            const pageTitleMatch = html.match(/<title>OSH Park ~ ([^<]*)<\/title>/);
            if (pageTitleMatch) {
                title = pageTitleMatch[1].trim();
                if (!title) {
                    title = `Board ${projectId}`;
                }
            }
            const h3Match = html.match(/project__row__header-content[^>]*>.*?<h3[^>]*>([^<]+)<\/h3>/s);
            if (h3Match) {
                const h3Title = h3Match[1].trim();
                if (h3Title) {
                    title = h3Title;
                }
            }

            // Dimensions: "1.64 x 1.10 inches (41.7 x 27.9 mm)"
            const dimMatch = html.match(/([\d.]+)\s*[x×]\s*([\d.]+)\s*inches.*?\(([\d.]+)\s*[x×]\s*([\d.]+)\s*mm\)/i);
            if (dimMatch) {
                dimensions = {
                    inches: `${dimMatch[1]} x ${dimMatch[2]}`,
                    mm: `${dimMatch[3]} x ${dimMatch[4]}`
                };
            }

            // Description from meta tag
            const descMatch = html.match(/<meta\s+name="description"\s+content="([^"]+)"/);
            if (descMatch) {
                description = descMatch[1].trim();
            }

            if (price === null) {
                console.log(`  ${projectId}: no price found, skipping`);
                return null;
            }
            if (maxPrice !== null && price > maxPrice) {
                console.log(`  ${projectId}: price $${price.toFixed(2)} exceeds max $${maxPrice.toFixed(2)}, skipping`);
                return null;
            }

            console.log(`  ${projectId}: found '${title}' - $${price.toFixed(2)}`);
            return {
                title: title,
                url: projectUrl,
                price: price,
                project_id: projectId,
                layer_count: layerCount,
                dimensions: dimensions,
                description: description
            };
        }

        async function fetchProjectDetails(projectId, layers, maxPrice) {
            const url = `${OSHPARK_BASE}/${projectId}`;
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const html = await response.text();
                return parseProjectPage(html, projectId, url, layers, maxPrice);
            } catch (e) {
                console.log(`error fetching project ${projectId}: ${e}`);
                return null;
            }
        }

        // ---- main (port of get_random_board) ----
        function shuffle(array) {
            const arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        async function getRandomBoard({ keyword, maxPrice, layers, onProgress }) {
            onProgress && onProgress('loading project list...');
            let projects = await getProjectPool(onProgress);

            if (keyword) {
                projects = filterByKeyword(projects, keyword);
            }
            if (!projects.length) {
                throw new Error('no projects found matching your search criteria');
            }

            const ids = shuffle(projects.map(p => p.id));
            const attempts = Math.min(ids.length, MAX_ATTEMPTS);
            console.log(`checking random projects from pool of ${ids.length}...`);
            onProgress && onProgress(`checking random boards from pool of ${ids.length}...`);

            for (let i = 0; i < attempts; i++) {
                if (i > 0 && i % 25 === 0) {
                    onProgress && onProgress(`checking boards... (${i}/${attempts})`);
                }
                const board = await fetchProjectDetails(ids[i], layers, maxPrice);
                if (board) {
                    return board;
                }
            }

            if (attempts < ids.length) {
                throw new Error(`no match in ${attempts} random samples - try loosening your filters`);
            }
            throw new Error('no boards found matching your criteria');
        }

        // ---- UI ----
        document.getElementById('boardForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const keyword = document.getElementById('keyword').value.trim() || null;
            const maxPriceRaw = document.getElementById('maxPrice').value;
            const maxPrice = maxPriceRaw ? parseFloat(maxPriceRaw) : null;
            const layersStr = document.getElementById('layers').value || '2';
            const layers = layersStr.split(/\s+/)
                .map(x => parseInt(x, 10))
                .filter(n => !isNaN(n));

            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');

            resultDiv.classList.remove('show', 'error');
            loadingDiv.style.display = 'block';
            loadingDiv.textContent = 'searching...';

            try {
                const board = await getRandomBoard({
                    keyword: keyword,
                    maxPrice: maxPrice !== null && !isNaN(maxPrice) ? maxPrice : null,
                    layers: layers.length ? layers : [2],
                    onProgress: (msg) => { loadingDiv.textContent = msg; }
                });

                loadingDiv.style.display = 'none';

                document.getElementById('boardTitle').textContent = board.title;
                document.getElementById('boardPrice').textContent = `$${board.price.toFixed(2)}`;
                document.getElementById('boardLayers').textContent = `${board.layer_count}-layer`;
                document.getElementById('boardLink').href = board.url;

                // Handle description - show prominently
                const descriptionMain = document.getElementById('boardDescriptionMain');
                const descriptionText = document.getElementById('boardDescriptionText');
                if (board.description) {
                    descriptionText.textContent = board.description;
                    descriptionMain.style.display = 'block';
                } else {
                    descriptionMain.style.display = 'none';
                }

                // Handle dimensions
                const dimensionsSection = document.getElementById('dimensionsSection');
                if (board.dimensions) {
                    dimensionsSection.innerHTML = `
                        <span class="board-details-label">Size</span>
                        <span class="board-dimensions">${board.dimensions.inches} inches (${board.dimensions.mm} mm)</span>
                    `;
                } else {
                    dimensionsSection.innerHTML = '';
                }

                // Show details section if we have dimensions
                const boardDetails = document.getElementById('boardDetails');
                if (board.dimensions) {
                    boardDetails.style.display = 'block';
                } else {
                    boardDetails.style.display = 'none';
                }

                resultDiv.classList.add('show');
            } catch (error) {
                loadingDiv.style.display = 'none';
                document.getElementById('boardTitle').innerHTML = `<span class="error-message">error: ${error.message}</span>`;
                resultDiv.classList.add('show', 'error');
            }
        });
    </script>
</body>
</html>
